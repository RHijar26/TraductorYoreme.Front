<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
    <div class="layout-container flex h-full grow flex-col">
    <main class="flex-1 px-4 sm:px-10 lg:px-40 py-8">
    <!-- Page Header -->
    <div class="flex flex-wrap justify-between items-end gap-4 mb-8">
    <div class="flex flex-col gap-1">
    <h1 class="text-slate-900 dark:text-slate-100 text-3xl font-black tracking-tight">Gestión de Regiones</h1>
    <p class="text-slate-500 dark:text-slate-400 text-base">Configuración de delimitaciones geográficas lingüísticas.</p>
    </div>
    </div>
    <!-- Content Grid -->
    <div class="grid grid-cols-1 gap-8">        
        <section class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50">
                <h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">map</span>
                        Listado de Regiones
                </h2>
                <button (click)="openAddRegionModal()" class="flex items-center justify-center rounded-lg h-9 px-4 bg-primary text-white text-xs font-bold transition-all hover:scale-[1.02]">
                    <span class="material-symbols-outlined mr-1 text-base">add</span>
                        Agregar Nueva Región
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                <thead>
                <tr class="text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider">
                <th class="px-6 py-4 font-semibold">Nombre</th>
                <th class="px-6 py-4 font-semibold">Descripción</th>                
                <th class="px-6 py-4 font-semibold">Fecha de Creación</th>
                <th class="px-6 py-4 font-semibold text-right">Acciones</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                    <tr *ngFor="let region of regions()" class="hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                        <td class="px-6 py-4 text-sm font-bold text-slate-900 dark:text-slate-100">{{ region.name }}</td>
                        <td class="px-6 py-4 text-sm text-slate-600 dark:text-slate-400">{{ region.description }}</td>                
                        <td class="px-6 py-4 text-sm text-slate-600 dark:text-slate-400">{{ region.createDate | date:'dd MMM yyyy' }}</td>
                        <td class="px-6 py-4 text-right">
                            <div  class="flex justify-end gap-4">                          
                                <button (click)="openEditRegionModal(region)" class="text-primary hover:text-primary/80 transition-colors"><span class="material-symbols-outlined text-xl">edit</span></button>
                                <button (click)="openDeleteRegionModal(region)" class="text-red-700 hover:text-red-800/80 transition-colors">                                    
                                    <span class="material-symbols-outlined text-xl">delete</span>
                                </button>
                            </div>
                        </td>
                    </tr>               
                </tbody>
                </table>
            </div>
        </section>
    </div>
    </main>
  
    </div>
</div>
