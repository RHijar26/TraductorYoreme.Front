<div aria-labelledby="dialog-title" class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
    <div class="fixed inset-0 bg-gray-500/75 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"></div>

    <div class="bg-white dark:bg-slate-900 w-full max-w-[800px] rounded-xl shadow-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div class="px-8 py-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center">
            <div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Cargar Nueva Frase</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Agregue un nuevo par lingüístico al catálogo multilingüe.</p>
            </div>
            <button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form class="p-8 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="col-span-1 md:col-span-2 space-y-2">
        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Frase Original</label>
        <textarea class="w-full min-h-[120px] rounded-lg border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary p-4 placeholder:text-slate-400" placeholder="Ingrese el texto original aquí..."></textarea>
        </div>
        <div class="space-y-2">
        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Idioma Original</label>
        <div class="relative">
        <select class="w-full h-12 rounded-lg border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary px-4 appearance-none">
        <option value="">Seleccionar idioma</option>
        <option value="yoreme">Yoreme (Mayo)</option>
        <option value="spanish">Español</option>
        </select>
        <span class="material-symbols-outlined absolute right-3 top-3 text-slate-400 pointer-events-none">unfold_more</span>
        </div>
        </div>
        <div class="space-y-2">
        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Idioma Destino</label>
        <div class="relative">
        <select class="w-full h-12 rounded-lg border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary px-4 appearance-none">
        <option value="">Seleccionar idioma</option>
        <option value="spanish">Español</option>
        <option value="yoreme">Yoreme (Mayo)</option>
        </select>
        <span class="material-symbols-outlined absolute right-3 top-3 text-slate-400 pointer-events-none">unfold_more</span>
        </div>
        </div>
        <div class="col-span-1 md:col-span-2 space-y-2">
        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Traducción</label>
        <textarea class="w-full min-h-[120px] rounded-lg border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary p-4 placeholder:text-slate-400" placeholder="Ingrese la traducción correspondiente..."></textarea>
        </div>
        <div class="space-y-2">
        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Región / Variante</label>
        <div class="relative">
        <select class="w-full h-12 rounded-lg border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary px-4 appearance-none">
        <option value="">Seleccionar región</option>
        <option value="norte">Norte de Sinaloa</option>
        <option value="sur">Sur de Sonora</option>
        <option value="general">Uso General</option>
        </select>
        <span class="material-symbols-outlined absolute right-3 top-3 text-slate-400 pointer-events-none">location_on</span>
        </div>
        </div>
        <div class="space-y-2">
        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Modelo de Traducción</label>
        <div class="relative">
        <select class="w-full h-12 rounded-lg border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary px-4 appearance-none">
        <option value="">Seleccionar modelo</option>
        <option value="nmt-v1">Neural Machine Translation v1</option>
        <option value="expert">Validación por Experto</option>
        <option value="hybrid">Híbrido (IA + Humano)</option>
        </select>
        <span class="material-symbols-outlined absolute right-3 top-3 text-slate-400 pointer-events-none">neurology</span>
        </div>
        </div>
        </div>
        <div class="pt-6 border-t border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row justify-end gap-3">
        <button class="order-2 sm:order-1 px-6 py-2.5 rounded-lg font-semibold text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" type="button">
                                        Cancelar
                                    </button>
        <button class="order-1 sm:order-2 px-8 py-2.5 rounded-lg font-bold text-white bg-primary hover:bg-primary/90 shadow-md shadow-primary/20 transition-all flex items-center justify-center gap-2" type="submit">
        <span class="material-symbols-outlined text-xl">save</span>
                                        Guardar Frase
                                    </button>
        </div>
        </form>
    </div>
</div>
